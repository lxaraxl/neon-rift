<script>
const detail = document.getElementById('detail');
function showMiniature(id, view) {
  const img = document.getElementById(view);
  const legacy = 'art/hero_'+id+(view==='back'?'_back':'')+'.webp';
  const sprite = miniatureSource(id, view);
  img.onerror = sprite ? () => { img.onerror = null; img.src = legacy; } : null;
  img.src = sprite || legacy;
}
document.querySelectorAll('[data-id]').forEach(button => {
  button.onclick = () => {
    const { id, name } = button.dataset;
    document.getElementById('name').textContent = name;
    document.getElementById('big').src = 'art/big/'+id+'.webp';
    showMiniature(id, 'front');
    showMiniature(id, 'back');
    detail.showModal();
  };
});
document.getElementById('close').onclick = () => detail.close();
</script></html>
