<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0618"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800;900&family=Philosopher:wght@400;700&display=swap" rel="stylesheet"><title>Неоновый Разлом: 9999 призывов</title><style>
:root{--bg:#0a0618;--panel:rgba(22,14,48,.92);--panel2:rgba(36,22,72,.9);--line:rgba(160,120,255,.35);--pink:#ff3d8a;--cyan:#3ad1ff;--gold:#ffc23a;--txt:#f2ecff;--mut:#a99cc8;--ok:#3dff7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05030d;color:var(--txt);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(180,92,255,.25)}
img{image-rendering:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.btn{padding:10px 16px;border-radius:12px;font-weight:800;letter-spacing:.3px;background:linear-gradient(180deg,#5a3ad0,#3a1f98);box-shadow:0 3px 0 #1d0f55,inset 0 1px 0 rgba(255,255,255,.3);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d0f55}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#ffb020 60%,#e08a00);color:#3a1a00;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 3px 0 #8a4a00,inset 0 1px 0 #fff8c0}
.btn.pink{background:linear-gradient(180deg,#ff6aa8,#e0206a);box-shadow:0 3px 0 #7a0a3a,inset 0 1px 0 rgba(255,255,255,.4)}
.btn.cyan{background:linear-gradient(180deg,#6ae8ff,#1a9ad8);color:#002233;text-shadow:none;box-shadow:0 3px 0 #0a4a6a,inset 0 1px 0 #d0faff}
.btn.gray,.btn:disabled{background:linear-gradient(180deg,#4a4560,#2f2a44);box-shadow:0 3px 0 #15121f;color:#a59fc0;text-shadow:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.dot{position:relative}.dot::after{content:'';position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:#ff2a4a;box-shadow:0 0 0 2px #1a0f30}
/* top bar */
#top{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,rgba(5,3,13,.95),rgba(5,3,13,.6) 80%,transparent)}
.ava{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ff3d8a,#3ad1ff);padding:2px;position:relative;flex:none}
.ava img{width:100%;height:100%;background:#1a0f30;border-radius:10px;object-fit:contain}
.ava b{position:absolute;bottom:-4px;left:-4px;background:#1a0f30;border:1px solid var(--cyan);font-size:10px;padding:0 4px;border-radius:6px}
.pinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.pinfo .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .pw{font-size:12px;color:var(--gold);font-weight:800}
.cur{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:20px;padding:2px 4px 2px 6px;font-size:12px;font-weight:800}
.cur .p{width:16px;height:16px;border-radius:50%;background:linear-gradient(#5aff8a,#20a050);color:#002;font-size:12px;line-height:15px;text-align:center;margin-left:2px}
/* screen */
#screen{position:absolute;inset:0;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:calc(64px + env(safe-area-inset-top)) 10px 90px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#0a0618 60%,rgba(10,6,24,.85));border-top:1px solid var(--line)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:700;color:var(--mut);padding:2px 0}
#nav button i{font-style:normal;font-size:22px;filter:grayscale(.6);transition:transform .15s}
#nav button.on{color:#fff}#nav button.on i{filter:none;transform:translateY(-3px) scale(1.12);text-shadow:0 0 12px var(--pink)}
/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.h2{font-size:18px;font-weight:900;margin:4px 0 10px;background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-neon{font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#fff;text-shadow:0 0 8px var(--pink),0 0 20px var(--pink)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.mut{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:800;font-size:12px;white-space:nowrap;color:var(--mut)}
.tabs button.on{background:linear-gradient(180deg,#ff6aa8,#a0208a);color:#fff;border-color:transparent}
.bar{height:8px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold))}
/* hero cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hc{position:relative;border-radius:12px;padding:3px;aspect-ratio:.78;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;cursor:pointer}
.hc::before{content:'';position:absolute;inset:2px;border-radius:10px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),rgba(10,6,24,.9) 70%)}
.hc img{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:88%;z-index:1}
.hc .lv{position:relative;z-index:2;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);border-radius:6px;padding:0 5px;margin-bottom:1px}
.hc .rb{position:absolute;top:3px;left:3px;z-index:2;font-size:9px;font-weight:900;padding:0 4px;border-radius:5px;background:rgba(0,0,0,.6)}
.hc .el{position:absolute;top:2px;right:4px;z-index:2;font-size:12px}
.hc .stars{position:relative;z-index:2;font-size:8px;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 3px #000}
.hc.lock{filter:grayscale(1) brightness(.45)}.hc.inteam::after{content:'В отряде';position:absolute;z-index:3;bottom:0;left:0;right:0;background:var(--pink);font-size:9px;font-weight:900;text-align:center}
.hc .badge{position:absolute;z-index:3;right:3px;bottom:22px;font-size:9px;background:var(--ok);color:#002;border-radius:5px;padding:0 3px;font-weight:900}
/* team slots */
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:.8;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;position:relative;overflow:hidden;background:rgba(0,0,0,.3)}
.slot img{width:92%}.slot .x{position:absolute;top:0;right:3px;font-size:12px;color:#ff6a8a}
/* modal */
.modal{position:absolute;inset:0;z-index:60;background:rgba(3,1,10,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .2s}
.mbox{width:100%;max-height:88%;overflow-y:auto;background:linear-gradient(180deg,#24164a,#120a2a);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 0 0 1px rgba(255,61,138,.3),0 20px 60px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.mbox .mt{font-size:18px;font-weight:900;text-align:center;margin-bottom:10px}
.mbtns{display:flex;gap:8px;margin-top:12px}.mbtns .btn{flex:1}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.85);opacity:0}}
#toast{position:absolute;top:42%;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(20,10,40,.95);border:1px solid var(--pink);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;animation:toast 2.4s forwards;box-shadow:0 0 20px rgba(255,61,138,.4)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* rewards */
.rws{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rw{width:76px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;animation:pop .3s backwards}
.rw span{font-size:24px}.rw b{font-size:13px}.rw small{font-size:9px;color:var(--mut)}
/* city */
.scene{position:absolute;inset:0}
.scene canvas{width:100%;height:100%;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:5;animation:bob 3s ease-in-out infinite}
.hot b{background:linear-gradient(180deg,rgba(30,15,60,.95),rgba(10,5,25,.95));border:1px solid var(--c,#ff3d8a);color:#fff;font-size:11px;font-weight:900;padding:4px 9px;border-radius:9px;white-space:nowrap;box-shadow:0 0 12px var(--c,#ff3d8a);text-shadow:0 0 6px var(--c)}
.hot .ic{font-size:26px;filter:drop-shadow(0 0 8px var(--c))}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 5px))}}
.side{position:absolute;left:6px;top:calc(70px + env(safe-area-inset-top));z-index:6;display:flex;flex-direction:column;gap:8px}
.side.r{left:auto;right:6px}
.sbtn{width:52px;display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:800;text-shadow:0 1px 2px #000}
.sbtn i{font-style:normal;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,rgba(80,40,160,.95),rgba(30,15,70,.95));border:1px solid var(--line);box-shadow:0 0 10px rgba(180,92,255,.4)}
.banner{position:absolute;left:62px;right:62px;top:calc(68px + env(safe-area-inset-top));z-index:6;border-radius:14px;padding:8px 10px;background:linear-gradient(110deg,#ff3d8a,#7a2aff 60%,#3ad1ff);box-shadow:0 0 20px rgba(255,61,138,.5);font-weight:900;font-size:13px;display:flex;align-items:center;gap:8px;overflow:hidden;cursor:pointer}
.banner small{display:block;font-weight:600;font-size:10px;opacity:.9}.banner img{width:44px;margin:-8px 0}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 3s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bigbtn{white-space:nowrap;bottom:calc(86px + env(safe-area-inset-bottom))!important;position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:6;padding:12px 30px;font-size:16px}
/* battle */
#battle{position:absolute;inset:0;z-index:50;background:#000;overflow:hidden}
#battle canvas{position:absolute;inset:0;width:100%;height:100%}
.b-top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:8px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);pointer-events:none}
.b-title{font-weight:900;font-size:14px;text-shadow:0 0 8px var(--pink)}.b-round{font-size:12px;color:var(--gold);font-weight:800}
.b-meter{position:absolute;left:6px;top:calc(56px + env(safe-area-inset-top));width:84px;opacity:.9;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.mrow{display:flex;align-items:center;gap:3px;height:20px;background:rgba(0,0,0,.5);border-radius:6px;position:relative;overflow:hidden}
.mrow img{width:20px;height:20px;z-index:1;flex:none}.mrow i{position:absolute;left:20px;top:3px;bottom:3px;opacity:.8;border-radius:3px;max-width:calc(100% - 20px)}.mrow span{position:relative;z-index:1;font-size:10px;font-weight:900;margin-left:auto;margin-right:4px;text-shadow:0 1px 2px #000}
.mrow.big{height:30px}.mrow.big img{width:30px;height:30px}.mrow.big i{left:30px;max-width:calc(100% - 30px)}.mrow.big span{font-size:12px}
.b-ctrl{position:absolute;right:8px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.b-ctrl button{background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:900;font-size:12px}
.b-syn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));font-size:11px;font-weight:800;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:10px;color:var(--gold);border:1px solid rgba(255,194,58,.4)}
.b-start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.b-start span{font-size:54px;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 20px #ff3d8a,0 0 40px #ff9a3a;animation:bstart 1.1s forwards}
@keyframes bstart{0%{transform:scale(3);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.cutin{position:absolute;left:0;right:0;top:36%;height:150px;pointer-events:none;z-index:5}
.ci-band{position:absolute;inset:20px -20px;background:linear-gradient(90deg,transparent,var(--ec) 20%,#fff 50%,var(--ec) 80%,transparent);transform:skewY(-6deg);opacity:.85;animation:band var(--sp) forwards;box-shadow:0 0 40px var(--ec)}
.cutin img{position:absolute;height:190px;top:-30px;left:4%;filter:drop-shadow(0 0 12px var(--ec)) drop-shadow(0 0 2px #000);animation:ciimg var(--sp) forwards}
.cutin.e img{left:auto;right:4%;transform:scaleX(-1)}
.ci-txt{position:absolute;right:6%;top:52px;text-align:right;animation:citxt var(--sp) forwards}.cutin.e .ci-txt{right:auto;left:6%;text-align:left}
.ci-txt small{display:block;font-weight:800;color:#120a2a;font-size:13px}.ci-txt b{font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000,0 0 12px var(--ec);font-style:italic}
@keyframes band{0%{transform:skewY(-6deg) scaleX(0)}15%{transform:skewY(-6deg) scaleX(1)}85%{opacity:.85}100%{opacity:0}}
@keyframes ciimg{0%{opacity:0;translate:-60px 0}20%{opacity:1;translate:0 0}85%{opacity:1}100%{opacity:0;translate:30px 0}}
@keyframes citxt{0%{opacity:0;translate:40px 0}25%{opacity:1;translate:0 0}85%{opacity:1}100%{opacity:0}}
.ucin{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden;animation:ucfade var(--sp) forwards}
.ucin .ubg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.15),rgba(6,2,18,.88) 70%)}
.ucin .ray{position:absolute;left:50%;top:45%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,transparent 0 5deg,var(--ec) 5.5deg 6.5deg,transparent 7deg 11deg,rgba(255,255,255,.85) 11.3deg 11.8deg,transparent 12.2deg 17deg);opacity:.45;animation:urot calc(var(--sp)*2) linear infinite;will-change:transform}
.ucin .slab{position:absolute;left:-10%;right:-10%;top:30%;height:44%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ec) 70%,#000) 15%,var(--ec) 45%,#fff 50%,var(--ec) 55%,color-mix(in srgb,var(--ec) 70%,#000) 85%,transparent);transform:skewY(-8deg) scaleX(0);box-shadow:inset 0 4px 0 #fff,inset 0 -4px 0 #fff;will-change:transform;animation:uslab var(--sp) cubic-bezier(.2,.9,.2,1) forwards}
.ucin .slab{overflow:hidden}.ucin .slab:after{content:'';position:absolute;top:0;bottom:0;left:-40px;right:0;background:repeating-linear-gradient(100deg,transparent 0 18px,rgba(255,255,255,.18) 18px 20px);animation:ulines .35s linear infinite;will-change:transform}
.ucin img{position:absolute;bottom:20%;left:0;height:min(74%,700px);max-width:78%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 10px var(--ec));will-change:transform,opacity;animation:uimg var(--sp) cubic-bezier(.15,.85,.25,1) forwards}
.ucin.e img{left:auto;right:3%;transform:scaleX(-1)}
.ucin .unm{top:auto!important;bottom:29%;z-index:2}
.ucin .unm{position:absolute;right:5%;top:58%;text-align:right;animation:unm var(--sp) cubic-bezier(.2,1.4,.3,1) forwards}
.ucin.e .unm{right:auto;left:5%;text-align:left}
.ucin .unm small{display:block;font:800 15px Manrope,system-ui;color:#fff;letter-spacing:3px;text-shadow:0 0 8px var(--ec),0 2px 0 #000}
.ucin .unm b{display:block;font:900 italic 40px/1.05 Unbounded,system-ui;background:linear-gradient(#fff 10%,#fff3b0 40%,#ffc23a 70%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #2a0a00);max-width:62vw}
.ucin i{position:absolute;width:22px;height:22px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);will-change:transform;animation:utw .6s ease-in-out infinite alternate}
.ucin .uwf{position:absolute;inset:0;background:#fff;opacity:0;animation:uwf var(--sp) forwards}
@keyframes ucfade{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes urot{to{transform:rotate(360deg)}}
.gacha>.scroll{position:static!important;inset:auto!important;overflow:visible!important}
.ucin img.uh{left:auto;right:-8%;bottom:auto;top:22%;height:62%;max-width:none;opacity:.32;filter:blur(1px) brightness(1.4) drop-shadow(0 0 0 var(--ec));mix-blend-mode:screen;transform:scaleX(-1);animation:ughost var(--sp) linear forwards}
.ucin.e img.uh{right:auto;left:-8%;transform:none}
.ucin .slab:before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 1.5px,transparent 2px) 0 0/14px 14px;opacity:.5;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.ucin .ust{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.8;animation:ustk .5s linear infinite;will-change:transform}
@keyframes ustk{from{transform:translateX(60vw) skewY(-8deg)}to{transform:translateX(-120vw) skewY(-8deg)}}
@keyframes ughost{0%{opacity:0;translate:-10% 0}15%{opacity:.32}100%{opacity:.25;translate:6% 0}}
.bnt{display:flex;gap:6px;margin-bottom:10px}.bnt button{flex:1;padding:8px 4px;border-radius:12px;border:2px solid #e8a83a;background:linear-gradient(#4a2e18,#2a180a);color:#fff6d0;font:700 14px Philosopher,serif;opacity:.75}.bnt button.on{opacity:1;background:linear-gradient(#ffd56a,#e89a2a);color:#4a2200;box-shadow:0 0 12px rgba(255,200,80,.6)}

.sigb i{background:linear-gradient(90deg,#3ad1ff,#c06bff)!important}
.gbanner.norm{filter:saturate(.85)}.gbanner.fr{filter:hue-rotate(-20deg)}
.c99h{text-align:center;line-height:.9;margin:4px 0 6px}.c99h b{display:block;font:900 italic 58px Unbounded,system-ui;background:linear-gradient(#fff 10%,#fff3b0 40%,#ffc23a 70%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0a00) drop-shadow(0 0 14px rgba(255,160,60,.6))}.c99h span{font:800 16px Unbounded,system-ui;letter-spacing:6px;color:#fff;text-shadow:0 0 10px #ff3d8a,0 2px 0 #000}
.c99s{margin:0 14px 10px;padding:8px 10px;border-radius:12px;background:rgba(20,8,40,.72);border:1.5px solid #e8a83a;color:#fff6d0;font:600 12px/1.4 Manrope,system-ui;text-align:center}
.c99g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 14px}
.c99c{position:relative;aspect-ratio:1;border-radius:12px;background:linear-gradient(#3a2470,#1c1040);border:1.5px solid rgba(180,140,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}

#nav button i::after{content:'';position:absolute;left:18%;top:8%;width:64%;height:30%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.45),transparent);pointer-events:none}

/* ===== v7 GAME UI: painted backdrops, gold-framed panels, ribbon titles ===== */

.li .tx b,.pack b{font:800 13px Unbounded,system-ui!important;color:#5a2a0a!important}

/* stage list */
.stage-map{gap:4px!important}
.stg .n{width:44px!important;height:44px!important;border-radius:50%!important;font:900 12px Unbounded,system-ui!important;color:#fff!important;text-shadow:0 1px 0 #1a0a4a;
  background:radial-gradient(circle at 50% 35%,#7a6af0,#3a2aa0 65%,#1e1460)!important;box-shadow:0 0 0 2px #ffe9a0,0 0 0 3.5px #b06a1c!important}
.stg.now .n{background:radial-gradient(circle at 50% 30%,#fff2b0,#ffb030 60%,#c86a10)!important;color:#5a2a00!important;text-shadow:0 1px 0 #fff6c8}

/* ribbon section titles */
.h2{display:table!important;margin:12px auto 8px!important;height:28px;line-height:23px;padding:0 6px!important;text-align:center;
  border-style:solid;border-width:0 22px;border-image:url(art/ui/ribbon.png) 0 66 fill / 0 22px / 0 stretch;
  font:800 13px Unbounded,system-ui!important;color:#fff!important;-webkit-text-fill-color:#fff;background:none!important;
  text-shadow:0 1.5px 0 #6a0a2a,1px 0 0 #6a0a2a,-1px 0 0 #6a0a2a,0 -1px 0 #6a0a2a!important;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}

.card .title-neon{font:900 16px Unbounded,system-ui!important;color:#c8401c!important;text-shadow:0 1px 0 #fff6d0!important}

/* tabs: framed tags */
.tabs{gap:4px!important;padding:2px 0 4px}

  padding:2px 6px 4px!important;font:800 11px Unbounded,system-ui!important;color:#6a3a14!important;border-radius:0!important;box-shadow:none!important}

/* chunky game buttons */
.btn{border:2px solid #3a1a06!important;border-radius:12px!important;position:relative;overflow:hidden;font:800 12.5px Unbounded,system-ui!important;
  color:#fff!important;text-shadow:0 1.5px 0 rgba(40,10,0,.75),1px 0 0 rgba(40,10,0,.5),-1px 0 0 rgba(40,10,0,.5)!important;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.65),0 3px 0 #3a1a06!important}

.btn.gold{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.08) 45%,rgba(255,255,255,0) 50%),linear-gradient(180deg,#ffe680,#ffb020 55%,#f08a00)!important}

/* resource pills & inline icons */

/* hero cards */
.hc{border-radius:12px!important;box-shadow:0 0 0 2px #ffe9a0,0 0 0 3.5px #8a4a14,0 4px 6px rgba(0,0,0,.35)!important}

.btn.dot::after{content:'';position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#ff2a4a;box-shadow:0 0 0 2px #fff;overflow:visible}

.h2{height:32px!important;line-height:27px!important;font-size:14px!important;border-width:0 24px!important;border-image-width:0 24px!important;padding:0 10px!important}
.scroll>.mut,.scroll>div>.mut,.gacha>.mut{color:#fff!important;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.8);font-weight:700}
.card b[style*="#fff"]{color:#5a2a0a!important}
.hd{background:linear-gradient(180deg,rgba(30,14,60,.15),rgba(30,14,60,.55) 45%,rgba(30,14,60,.75)),url(art/bg_tower.webp) center top/cover no-repeat!important;background-attachment:local,local!important}
.hd-name b{font:900 24px Unbounded,system-ui;color:#fff;text-shadow:0 2px 0 #3a1a70,1px 0 0 #3a1a70,-1px 0 0 #3a1a70,0 0 12px var(--ec)}

.anims .chip,.hd .chips .chip{background:linear-gradient(180deg,#4a2e18,#2a180a)!important;color:#fff6d0!important;border:none!important;box-shadow:0 0 0 1.5px #e8a83a!important;font:800 10.5px Unbounded,system-ui!important}
.hd-back .chip{background:linear-gradient(180deg,#4a2e18,#2a180a)!important;border:none!important;box-shadow:0 0 0 1.5px #e8a83a!important}

/* hero card: big art + framed animated mini-model (front sprite) */
.hd-stage{height:340px!important}
.hd-stage img.ava{width:auto!important;height:330px;max-width:92%;object-fit:contain;animation:none!important}
.hd-stage .mini{position:absolute;left:8px;bottom:6px;width:120px;height:130px;z-index:3;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.75);border-radius:6px;
  box-shadow:0 0 0 1px rgba(255,230,170,.5),inset 0 0 14px rgba(255,255,255,.25);backdrop-filter:blur(2px)}
.hd-stage .mini::after{content:'';position:absolute;left:22%;right:22%;bottom:9px;height:12px;border-radius:50%;background:radial-gradient(ellipse,rgba(40,20,60,.35),transparent 70%)}

.hd-stage .mini i:nth-child(1){left:-3px;top:-3px;border-right:0;border-bottom:0}.hd-stage .mini i:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0}
.hd-stage .mini i:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0}.hd-stage .mini i:nth-child(4){right:-3px;bottom:-3px;border-left:0;border-top:0}

  background:#fff;color:#5a2a0a;font:800 11px Manrope,system-ui;padding:5px 9px;border-radius:12px;box-shadow:0 0 0 2px #e8a83a,0 3px 6px rgba(0,0,0,.3);animation:bubpop .25s cubic-bezier(.3,1.6,.5,1)}

/* v8 battle HUD like reference: VS bar, round, total damage, golden emblem */

// ===== ART v2: vector anime-chibi characters (SVG) =====
const ART = (() => {
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
  function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
  function shade(h,a){const[r,g,b]=hexToRgb(h);if(a>=0)return rgbToHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);return rgbToHex(r*(1+a),g*(1+a),b*(1+a))}
  const OL='#1b1030';
  const lg=(id,stops,x2=0,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join('')}</linearGradient>`;
  const rg=(id,stops,cx=.4,cy=.35)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r=".75">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join('')}</radialGradient>`;
  const GLOW=`<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".35"/></filter>`;
  const S=(w,h,defs,body,W=w*2,H=h*2)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${w} ${h}"><defs>${GLOW}${defs}</defs>${body}</svg>`;
  const st=(w=3)=>`stroke="${OL}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

  function eye(cx,cy,col,flip){const dk=shade(col,-.6),lt=shade(col,.45);const f=flip?-1:1;
    return`<ellipse cx="${cx}" cy="${cy+1}" rx="11.5" ry="13.5" fill="#fff"/>
    <ellipse cx="${cx}" cy="${cy+2}" rx="10" ry="12.5" fill="url(#iris)"/>
    <ellipse cx="${cx}" cy="${cy+3}" rx="4.6" ry="6.5" fill="${dk}"/>
    <path d="M${cx-13*f} ${cy-7} Q${cx} ${cy-18} ${cx+13*f} ${cy-9}" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>
    <path d="M${cx+12*f} ${cy-9} l${5*f} -3" stroke="${OL}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx-4*f}" cy="${cy-4}" r="4.2" fill="#fff"/><circle cx="${cx+4*f}" cy="${cy+7}" r="2" fill="#fff" opacity=".85"/>
    <path d="M${cx-8} ${cy+12} Q${cx} ${cy+15} ${cx+8} ${cy+12}" stroke="${lt}" stroke-width="2" fill="none" opacity=".7"/>`}

  // ---------- HERO ----------

function heroStats(id,ov){
  const d=HMAP[id],h=ov||S.heroes[id],c=CLS[d.cls],r=RAR[d.rar].m;
  const lm=1+(h.lvl-1)*.09, sm=1+(h.star-1)*.22;
  let hp=c.hp*r*lm*sm, atk=c.atk*r*lm*sm, def=c.def*r*(1+(h.lvl-1)*.05)*sm, spd=c.spd+(h.star-1)*2;
  const g=h.gear||{};
  GEAR_SLOTS.forEach(s=>{const t=g[s.k];if(t==null)return;const v=GEAR_VAL[s.st][t];if(s.st==='atk')atk+=v*(1+h.lvl*.03);if(s.st==='hp')hp+=v*(1+h.lvl*.03);if(s.st==='def')def+=v*(1+h.lvl*.02);if(s.st==='spd')spd+=v});
  let xcr=0;if(!ov){const gt=S.guild.tree[d.cls]||0;atk*=1+gt*.02;hp*=1+gt*.02;const ab=albumBonus();atk*=1+ab.atk;hp*=1+ab.hp;
    (h.imp||[]).forEach(t=>{if(t!=null){atk*=1+IMP_V[t];hp*=1+IMP_V[t]}});(h.chip||[]).forEach(t=>{if(t!=null){def*=1+CHIP_DEF[t];xcr+=CHIP_CR[t]}});const rb=rshBonus();atk*=1+rb.atk;hp*=1+rb.hp;def*=1+rb.def;spd+=rb.spd;xcr+=rb.crit}

  return{hp:Math.round(hp),atk:Math.round(atk),def:Math.round(def),res:Math.round(def*c.rm),spd:Math.round(spd),crit:+((d.cls==='arch'?.2:.1)+xcr).toFixed(3),pen:+pen.toFixed(3)};
}

const Battle=(()=>{
  let tags=[],totalDmg=0,totEl=null;let cv,g,W,H,DPR,units=[],fx=[],floats=[],parts=[],running=false,headless=false,speed=1,bgCanvas=null,bgType='street',sprites={a:null,e:null},shake=0,flash=null,roundNo=0,maxRounds=15,ov,hudRound,meterEl;

  let amb={},rifts=null,bgOpt={},locSt={};

  function mkUnit(u,side,i,buffs){
    const st=Object.assign({},u.st);
    if(buffs){if(buffs.atk)st.atk*=1+.2*buffs.atk;if(buffs.hp)st.hp*=1+.25*buffs.hp;if(buffs.crit)st.crit+=.2*buffs.crit;if(buffs.spd)st.spd+=15*buffs.spd}

    const o={...u,side,idx:i,st,maxhp:Math.round(st.hp),hp:Math.round(st.hp),energy:buffs&&buffs.energy?50:0,s:{},art,dmg:0,heal:0,dead:false,x:0,y:0,ax:0,ay:0,anim:null,hitT:0,appear:now()+1150+i*110+(side==='e'?260:0),scale:u.boss?1.5:1};
    if(u.hpFrac!=null){o.hp=Math.round(o.maxhp*u.hpFrac);if(o.hp<=0){o.hp=0;o.dead=true}}
    return o;
  }
  // isometric diagonal formation (like reference): allies bottom-left facing up-right, enemies top-right facing down-left
  let AX={x:.6,y:-.8},PX={x:.8,y:.6};
  function layout(){
    const FL={tower:.5,cave:.42,arena:.44,town:.4,forest:.34}[bgType]||.38;const ey=Math.max(.39,FL+.1),ay=Math.min(.8,Math.max(.64,ey+.24));const A={x:W*.38,y:H*ay},E={x:W*.64,y:H*ey};
    let vx=E.x-A.x,vy=E.y-A.y;const L=Math.hypot(vx,vy);vx/=L;vy/=L;AX={x:vx,y:vy};PX={x:-vy,y:vx};if(PX.x<0){PX.x*=-1;PX.y*=-1}

        u.x=C.x+AX.x*off*dir+PX.x*k*st;u.y=C.y+AX.y*off*dir+PX.y*k*st;u.row=row});
      if(back.length){place(front,rowGap*.55,'f');place(back,-rowGap*.55,'b')}else place(front,0,'f');
      list.forEach(u=>{u.hx=u.x;u.hy=u.y;u.ps=.84+.3*(u.y/H)})});
  }
  const alive=side=>units.filter(u=>u.side===side&&!u.dead);

  // ---------- fx helpers ----------
  function float(x,y,text,color,size=1){if(headless)return;floats.push({x:x+rnd(-12,12)*DPR,y,text,color,t0:now(),dur:1000/Math.sqrt(speed),size})}

  const loop=t=>{if(!cv.isConnected)return;raf=requestAnimationFrame(loop);const W=cv.width,H=cv.height;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
    const im=bigArt(id);const iw=im.width||im.naturalWidth,ih=im.height||im.naturalHeight;if(!iw)return;
    const sc=Math.min(W*.98/iw,H*.97/ih),dw=iw*sc,dh=ih*sc,x0=(W-dw)/2,y0=H-dh-H*.015+Math.sin(t/1400)*H*.006;
    // aura
    g.save();g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(W/2,y0+dh*.45,0,W/2,y0+dh*.45,dw*.62);rg.addColorStop(0,ec+'55');rg.addColorStop(1,ec+'00');g.fillStyle=rg;g.fillRect(0,0,W,H);g.restore();
    // shadow
    g.fillStyle='rgba(20,8,40,.35)';g.beginPath();g.ellipse(W/2,H-H*.02,dw*.32,dh*.025,0,0,7);g.fill();
    // sliced warp: feet fixed, upper body breathes and sways (hair, cloak)
    const N=48,br=Math.sin(t/900),sw=Math.sin(t/1700),sw2=Math.sin(t/620);
    for(let i=0;i<N;i++){const v0=i/N,v1=(i+1)/N,vt=1-v0;const sy=ih*v0,sh=ih/N+1;
      const breathe=1+.012*br*Math.max(0,Math.min(1,(vt-.25)*2.2));const yy=y0+dh*(1-(1-v0)*breathe);
      const dx=(sw*.012*Math.pow(vt,1.6)+sw2*.004*Math.pow(Math.max(0,vt-.55),1.2))*dw;
      const wsc=1+.006*br*Math.max(0,vt-.4);
      g.drawImage(im,0,sy,iw,sh,x0+dx-(dw*(wsc-1))/2,yy,dw*wsc,dh/N*breathe+1)}
    // particles
    if(P.length<26&&Math.random()<.35)P.push({x:x0+Math.random()*dw,y:y0+dh*(.3+Math.random()*.7),v:.3+Math.random()*.8,r:1+Math.random()*2.5,a:0,ph:Math.random()*6});
    g.save();g.globalCompositeOperation='lighter';for(let k=P.length-1;k>=0;k--){const q=P[k];q.y-=q.v*(W/400);q.a=Math.min(1,q.a+.04);const al=q.a*Math.max(0,(q.y-y0)/(dh*.4));if(q.y<y0){P.splice(k,1);continue}
      g.globalAlpha=Math.min(1,al);const R=q.r*(W/400)*3;const pg=g.createRadialGradient(q.x+Math.sin(t/500+q.ph)*6,q.y,0,q.x,q.y,R);pg.addColorStop(0,'#fff');pg.addColorStop(.3,ec);pg.addColorStop(1,ec+'00');g.fillStyle=pg;g.beginPath();g.arc(q.x+Math.sin(t/500+q.ph)*6,q.y,R,0,7);g.fill()}g.restore()};
  raf=requestAnimationFrame(loop);window.addEventListener('resize',fit,{once:true})}

      <div class="row"><button class="btn sp p1 ${have>=B.cost1?'cyan':'gray'}">×1 · ${ICON.svg(cur,'ri')}${fmt(B.cost1)}</button><button class="btn sp p10 ${have>=B.cost10?'pink':'gray'}">×10 · ${ICON.svg(cur,'ri')}${fmt(B.cost10)}</button></div>
      <div class="card" style="margin-top:10px"><b>Герои баннера</b><div class="grid" style="margin-top:8px;grid-template-columns:repeat(5,1fr)">${show.map(h=>`<div class="hc ${S.heroes[h.id]?'':'lock'}" style="background:${RAR[h.rar].g}"><img src="${heroImg(h.id)}"></div>`).join('')}</div></div>`}
    o.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn sm gray back">← Назад</button><span class="sp"></span><span class="chip">${ICON.svg('ticket','ri')} ${S.tickets}</span><span class="chip">${ICON.svg('gem','ri')} ${fmt(S.gems)}</span></div>${tabs}${body}${elems}
      ${bn==='prem'?`<div class="card" style="margin-top:10px"><b>UR-герои</b><div class="grid" style="margin-top:8px;grid-template-columns:repeat(5,1fr)">${HEROES.filter(h=>h.rar==='UR').map(h=>`<div class="hc ${S.heroes[h.id]?'':'lock'}" style="background:${RAR.UR.g}"><img src="${heroImg(h.id)}"></div>`).join('')}</div></div>`:''}`;
    $('.back',o).onclick=()=>{o.remove();refresh()};
    o.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{bn=x.dataset.b;SFX.click();render()});
    o.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{S.sigEl=x.dataset.e==='any'?null:x.dataset.e;save();SFX.click();render()});
    const wb=$('.wish',o);if(wb)wb.onclick=()=>{const m=modal('Выберите желаемого UR',`<div class="grid" style="grid-template-columns:repeat(3,1fr)">${HEROES.filter(h=>h.rar==='UR').map(h=>`<div class="hc" data-w="${h.id}" style="background:${RAR.UR.g};${S.wish===h.id?'box-shadow:0 0 0 3px #fff':''}"><img src="${heroImg(h.id)}"><span class="lv">${h.name}</span></div>`).join('')}</div>`,[]);m.m.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{S.wish=x.dataset.w;save();m.close();render()})};
    const sg=$('.sig',o);if(sg)sg.onclick=()=>{if(!S.sigEl){toast('Сначала выбери стихию-фокус ниже');return}signalPick(()=>render())};
    $('.p1',o).onclick=()=>doPull(1);$('.p10',o).onclick=()=>doPull(10);
  };
  const doPull=n=>{
    if(bn!=='prem'){const B=BANNERS[bn],c=n===1?B.cost1:B.cost10,k=bn==='norm'?'gold':'hearts';if((S[k]||0)<c){toast(bn==='norm'?'Не хватает золота':'Не хватает сердечек');return}S[k]-=c;
      const res=[];for(let i=0;i<n;i++)res.push(pullFromBanner(bn));quest('summon',n);addPxp(n*2);save();renderTop();pullAnim(res.map(r=>({img:heroImg(r.id),name:HMAP[r.id].name,rar:r.rar,isNew:r.isNew})),()=>render(),()=>doPull(n));return}
    if(n===1&&S.daily.freeHero){S.daily.freeHero=false}
    else if(S.tickets>=n)S.tickets-=n;else{const c=n===1?300:2800;if(S.gems<c){toast('Не хватает алмазов');go('shop');o.remove();return}S.gems-=c}
    const res=[];const forceFirst=n===10&&!S.firstTen;for(let i=0;i<n;i++)res.push(pullHero(forceFirst&&i===9&&!res.some(r=>r.rar==='UR')));if(n===10)S.firstTen=true;
    S.signal=(S.signal||0)+n*10;
    quest('summon',n);addPxp(n*5);save();pullAnim(res.map(r=>({img:heroImg(r.id),name:HMAP[r.id].name,rar:r.rar,isNew:r.isNew})),()=>{render();if(S.signal>=SIG_NEED&&S.sigEl)toast('Сигнал заполнен — выбери SSR!')},()=>doPull(n));
  };
  render();
}
function pullAnim(cards,onDone,again){
  const best=['UR','SSR','SR','R'].find(r=>cards.some(c=>c.rar===r));const pc={UR:'#ffc23a',SSR:'#c06bff',SR:'#4aa8ff',R:'#8fa3b8'}[best];
  const o=el(`<div class="pull-ov"><div class="portal" style="--pc:${pc}"></div></div>`);$('#app').appendChild(o);SFX.gacha();
  setTimeout(()=>{o.innerHTML=`${best==='UR'?'<div class="ur-flash"></div>':''}<div class="title-neon" style="font-size:22px;margin-bottom:8px">${best==='UR'?'✦ UR! ✦':'Результат'}</div><div class="pull-cards ${cards.length===1?'one':''}">${cards.map(c=>`<div class="pc ${c.rar}"><div class="in"><div class="bk">✦</div><div class="fr" style="background:${RAR[c.rar].g}"><img src="${c.img}">${c.isNew?'<span class="nw">NEW</span>':''}<b>${c.rar}<br>${c.name}</b></div></div></div>`).join('')}</div>
    <div class="row" style="margin-top:14px;gap:10px"><button class="btn gray ok">OK</button>${again?`<button class="btn pink again">Ещё ×${cards.length}</button>`:''}</div><div class="mut" style="margin-top:6px">Повторы превращаются в осколки для звёзд</div>`;
    if(best==='UR')SFX.ur();
    o.querySelectorAll('.pc').forEach((c,i)=>setTimeout(()=>{c.classList.add('flip');if(!S.muted)SFX.click()},200+i*130));
    $('.ok',o).onclick=()=>{o.remove();onDone&&onDone();renderTop()};if(again)$('.again',o).onclick=()=>{o.remove();again()};
  },1500);
}

  return botTeam(p*mult).map(u=>Object.assign(u,{name:'Тень '+u.name}))}

(()=>{const M={'🪙':'coin','💎':'gem','📘':'book','🎫':'ticket','🔷':'crystal','💠':'crystal','🏅':'medal','🌟':'shard','🎒':'bag','⭐':'star','🎁':'gift','🏆':'trophy','👑':'crown','🔒':'lock','✅':'check','🏁':'star','🆓':'free','🔥':'fire','⚡':'bolt','🌀':'vortex','✦':'light','⚔':'battle','🛡':'shield','🔮':'orb','🎯':'target','✚':'heal','❤':'heart','🩸':'drop','✨':'assistant','💾':'disk','💨':'wind','🌵':'thorns','🗡':'sword','🥋':'armor','⛑':'helmet','👢':'boot','💫':'stun','💔':'broken','⏫':'up','⏬':'down','⏭':'skip','💳':'card','🏰':'city','🏟':'arena','🔄':'refresh','🐱':'cat','👤':'user','👹':'demon','🕳':'hole','✔':'check','☀':'sun','♥':'heart','💬':'quests'};
  const re=new RegExp('('+Object.keys(M).join('|')+')️?','g');
  function fix(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];let n;while(n=w.nextNode()){re.lastIndex=0;if(re.test(n.nodeValue))list.push(n)}
    for(const t of list){const p=t.parentNode;if(!p||p.closest&&p.closest('svg'))continue;const sp=document.createElement('span');sp.className='emo';
      sp.innerHTML=t.nodeValue.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(re,(m,e)=>ICON.svg(M[e],'ri'));p.replaceChild(sp,t)}}
  const start=()=>{const a=document.getElementById('app')||document.body;fix(a);new MutationObserver(ms=>{for(const m of ms)for(const nd of m.addedNodes){if(nd.nodeType===1)fix(nd);else if(nd.nodeType===3&&nd.parentNode)fix(nd.parentNode)}}).observe(document.body,{childList:true,subtree:true,characterData:false})};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();
